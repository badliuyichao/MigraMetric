# 测试环境配置
spring:
  config:
    activate:
      on-profile: test

  # H2内存数据库（用于单元测试）
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  # H2控制台
  h2:
    console:
      enabled: true
      path: /h2-console

# 日志配置 - 测试环境
logging:
  level:
    root: WARN
    com.migrametric: DEBUG
