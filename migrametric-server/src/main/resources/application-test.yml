# 测试环境配置
spring:
  config:
    activate:
      on-profile: test

  # H2内存数据库（用于单元测试）
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_UPPER=false
    username: sa
    password:

  # JPA/Hibernate配置（用于测试）
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: false

  # H2控制台
  h2:
    console:
      enabled: true
      path: /h2-console

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.migrametric.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# JWT配置
jwt:
  secret: TestSecretKeyForJWTTokenTestingOnlyNotForProduction
  # Token有效期：1小时（单位：毫秒）
  expire-time: 3600000
  # Token刷新有效期：7天
  refresh-expire-time: 604800000

# Swagger配置 - 测试环境禁用
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 日志配置 - 测试环境
logging:
  level:
    root: WARN
    com.migrametric: DEBUG
    com.migrametric.mapper: WARN
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'
