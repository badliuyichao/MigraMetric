# ============================================
# MigraMetric 数据库配置文件
# ============================================
# 说明：
#   1. 此文件包含所有环境的数据库配置
#   2. 请根据部署环境选择对应配置
#   3. 生产环境密码请使用环境变量或密钥管理服务
# ============================================

# ============================================
# 开发环境 (Development)
# ============================================
[development]
# 数据库连接信息
host = localhost
port = 3306
database = migrametric_dev
username = root
password = admin123
charset = utf8mb4

# 连接池配置
pool.minIdle = 5
pool.maxPoolSize = 20
pool.connectionTimeout = 30000
pool.idleTimeout = 600000
pool.maxLifetime = 1800000

# 性能优化
cachePrepStmts = true
prepStmtCacheSize = 250
prepStmtCacheSqlLimit = 2048
useServerPrepStmts = true
useLocalSessionState = true
rewriteBatchedStatements = true
cacheResultSetMetadata = true
cacheServerConfiguration = true
eliminator = true
maintainTimeStats = false

# 调试配置
showSql = true
formatSql = true
slowQueryThreshold = 3000


# ============================================
# 测试环境 (Test)
# ============================================
[test]
# 数据库连接信息
host = localhost
port = 3306
database = migrametric_test
username = root
password = root
charset = utf8mb4

# 连接池配置
pool.minIdle = 3
pool.maxPoolSize = 10
pool.connectionTimeout = 30000
pool.idleTimeout = 300000
pool.maxLifetime = 900000

# 性能优化
cachePrepStmts = true
prepStmtCacheSize = 250
prepStmtCacheSqlLimit = 2048
useServerPrepStmts = true
useLocalSessionState = true
rewriteBatchedStatements = true
cacheResultSetMetadata = true
cacheServerConfiguration = true
eliminator = true
maintainTimeStats = false

# 调试配置
showSql = true
formatSql = true
slowQueryThreshold = 2000


# ============================================
# 预发布环境 (Staging/Pre-production)
# ============================================
[staging]
# 数据库连接信息
host = staging-db.migrametric.com
port = 3306
database = migrametric_staging
username = migrametric_staging
password = ${DB_PASSWORD}          # 使用环境变量
charset = utf8mb4

# 连接池配置
pool.minIdle = 10
pool.maxPoolSize = 50
pool.connectionTimeout = 30000
pool.idleTimeout = 600000
pool.maxLifetime = 1800000

# 性能优化
cachePrepStmts = true
prepStmtCacheSize = 500
prepStmtCacheSqlLimit = 4096
useServerPrepStmts = true
useLocalSessionState = true
rewriteBatchedStatements = true
cacheResultSetMetadata = true
cacheServerConfiguration = true
eliminator = true
maintainTimeStats = false

# 调试配置（预发布环境可开启）
showSql = false
formatSql = false
slowQueryThreshold = 1000


# ============================================
# 生产环境 (Production)
# ============================================
[production]
# 数据库连接信息
host = ${DB_HOST}
port = ${DB_PORT:-3306}
database = migrametric
username = ${DB_USERNAME}
password = ${DB_PASSWORD}
charset = utf8mb4

# SSL配置
useSSL = true
requireSSL = true
serverCA = /path/to/ca-cert.pem
clientCertificate = /path/to/client-cert.pem
clientKey = /path/to/client-key.pem
verifyServerCertificate = true

# 连接池配置
pool.minIdle = 20
pool.maxPoolSize = 100
pool.connectionTimeout = 30000
pool.idleTimeout = 600000
pool.maxLifetime = 1800000
pool.connectionTestQuery = SELECT 1
pool.leakDetectionThreshold = 60000

# 性能优化
cachePrepStmts = true
prepStmtCacheSize = 500
prepStmtCacheSqlLimit = 4096
useServerPrepStmts = true
useLocalSessionState = true
rewriteBatchedStatements = true
cacheResultSetMetadata = true
cacheServerConfiguration = true
eliminator = true
maintainTimeStats = false

# 调试配置（生产环境关闭）
showSql = false
formatSql = false
slowQueryThreshold = 500

# 高可用配置
failoverReadOnly = true
autoReconnect = false
retriesAllDown = 3


# ============================================
# Spring Boot application.yml 格式
# ============================================
# 开发环境配置
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://localhost:3306/migrametric_dev?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

---
# 测试环境配置
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:mysql://localhost:3306/migrametric_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 3
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 900000

---
# 预发布环境配置
spring:
  config:
    activate:
      on-profile: staging
  datasource:
    url: jdbc:mysql://staging-db.migrametric.com:3306/migrametric_staging?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

---
# 生产环境配置
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:-3306}/migrametric?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true&requireSSL=true&verifyServerCertificate=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 20
      maximum-pool-size: 100
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      connection-test-query: SELECT 1


